t-size:11px;font-weight:800;border-radius:30px;padding:6px 8px;border:1px solid #4c6a73}.result-chip.goal{color:var(--danger)}.result-chip.save{color:var(--cyan)}.result-chip.miss{color:#d1dce0}.result-chip.post{color:var(--amber)}.bar-row{display:grid;grid-template-columns:98px 1fr 29px;gap:10px;align-items:center;margin:11px 0;font-size:12px}.bar-track{height:11px;border-radius:8px;background:#25414b;overflow:hidden}.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#5bb6be,var(--lime))}.modal-backdrop{position:fixed;inset:0;background:#020c14bb;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(410px,100%);background:#12303a;border:1px solid #5a7178;border-radius:20px;padding:22px;box-shadow:0 25px 90px #0009}.modal h3{font-size:21px}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8fbcd;color:#102b31;padding:11px 18px;border-radius:13px;z-index:99;font-size:13px;font-weight:800;box-shadow:0 12px 30px #0007;max-width:90%;text-align:center;pointer-events:none}.footer-note{color:#7798a1;font-size:11px;line-height:1.6;text-align:center;margin-top:25px}@media(max-width:600px){.shell{padding:16px 12px 85px}.panel{padding:16px}.grid2{grid-template-columns:1fr}.topline{margin-bottom:18px}.roster-row{grid-template-columns:72px minmax(0,1fr) 36px}.roster-row [data-field="role"]{grid-column:2;grid-row:2}.roster-row .remove-row{grid-column:3;grid-row:1/span 2}.match-card{align-items:flex-start;flex-direction:column}.match-card button{width:100%}.clock-meta{max-width:85px}.clock-bar{padding:9px 11px}.players-panel{padding:9px}.jersey-grid{grid-template-columns:repeat(auto-fill,minmax(47px,1fr))}.resin-btn{min-height:90px}}

<body>
  <div id="app"></div>
  <script>
  (()=>{
    'use strict';
    const STORAGE='keeperboard_v1';
    const POSITIONS=[
      {id:'LA',name:'Linksaußen',short:'LA',x:161,y:243},
      {id:'HL',name:'Halblinks',short:'HL',x:269,y:389},
      {id:'M',name:'Mitte',short:'M',x:400,y:437},
      {id:'HR',name:'Halbrechts',short:'HR',x:531,y:389},
      {id:'RA',name:'Rechtsaußen',short:'RA',x:639,y:243},
      {id:'K',name:'Kreis',short:'K',x:400,y:264},
      {id:'7M',name:'7 Meter',short:'7m',x:400,y:337},
      {id:'FREE',name:'Freie Position',short:'Frei'}
    ];
    const RESULTS={goal:{label:'Tor',color:'#ff9478',cls:'goal'},save:{label:'Gehalten',color:'#65d7dc',cls:'save'},miss:{label:'Vorbei',color:'#cedce1',cls:'miss'},post:{label:'Pfosten',color:'#ffd47e',cls:'post'}};
    const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    const mmss=ms=>{let sec=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')};
    const dateFmt=ts=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(ts));
    let db=load();
    const ui={screen:db.activeMatchId?'track':'home',setup:{homeId:'',awayId:'',resin:null},editId:null,editorReturn:'teams',editorSlot:null,stage:'keeper',keeper:null,shooter:null,comment:'',position:null,freeMode:false,freeCoord:null,target:null,statsMode:'all',statsPosition:'LA',statsKeeper:'all',statsFreeShot:null,statsPlayer:'all',statsPlayerShot:null,modal:null,toast:null};
    let toastTimer=0;
    const app=document.getElementById('app');

    function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&Array.isArray(v.teams)&&Array.isArray(v.matches))return {...v,activeMatchId:v.activeMatchId||null}}catch(_){}return {teams:[],matches:[],activeMatchId:null}}
    function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch(_){toast('Speichern nicht möglich – Speicherplatz prüfen.')}}
    function toast(msg){let div=document.querySelector('.toast');if(div)div.remove();div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.append(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3100)}
    const team=id=>db.teams.find(t=>t.id===id);
    const match=()=>db.matches.find(m=>m.id===db.activeMatchId);
    const opponent=m=>team(m?.awayId);
    const owned=m=>team(m?.homeId);
    const keepers=m=>(owned(m)?.players||[]).filter(p=>p.role==='goalkeeper');
    const keeperChoices=m=>keepers(m).length?keepers(m):(owned(m)?.players||[]);
    const clockMs=m=>m.clock.elapsedMs+(m.clock.runningSince!==null?Math.max(0,Date.now()-m.clock.runningSince):0);
    function pauseClock(m){if(m.clock.runningSince!==null){m.clock.elapsedMs=clockMs(m);m.clock.runningSince=null;save()}}
    function toggleClock(){const m=match();if(!m)return;if(m.clock.runningSince!==null)pauseClock(m);else{m.clock.runningSince=Date.now();save()}render()}
    function go(screen){const previousScreen=ui.screen;ui.screen=screen;ui.modal=null;if(screen==='track'&&previousScreen!=='stats')resetDraft();if(screen==='stats'){ui.statsMode='all';ui.statsPosition='LA';ui.statsKeeper='all';ui.statsFreeShot=null;ui.statsPlayer='all';ui.statsPlayerShot=null}render();window.scrollTo({top:0,behavior:'instant'})}
    function resetDraft(){const m=match(),selected=m?.activeKeeper;ui.keeper=m&&keeperChoices(m).some(g=>g.number===selected)?selected:null;ui.stage=ui.keeper===null?'keeper':'shooter';ui.shooter=null;ui.position=null;ui.freeMode=false;ui.freeCoord=null;ui.target=null;ui.comment=''}
    function header(back='',right=''){return `<header class="topline"><div class="brand"><span class="brand-logo">K</span><span>KEEPER<span style="color:var(--lime)">BOARD</span></span></div>${right||`<span class="tag">TORWART · HANDBALL</span>`}</header>${back?`<button class="back" data-route="${back}">← Zurück</button>`:''}`}
    function home(){
      const recent=[...db.matches].sort((a,b)=>b.createdAt-a.createdAt);
      return `${header()}<div class="eyebrow">DEIN TOR · DEINE DATEN</div><h1>Jeden Wurf.<br><span style="color:var(--lime)">Im Blick.</span></h1><p class="lead">Erfasse, wer wirft, von wo der Ball kommt und wohin er fliegt. Deine Spieluhr speichert die Wurfminute automatisch.</p>
      <div class="grid2"><button class="btn primary wide" data-route="setup" style="min-height:86px;font-size:19px">＋ Neues Spiel erstellen</button><button class="btn secondary wide" data-route="teams" style="min-height:86px;font-size:18px">♧ Mannschaften verwalten</button></div>
      ${db.activeMatchId&&match()?`<div class="panel lime-border" style="margin-top:17px"><div class="between"><div><div class="eyebrow">AKTUELLES SPIEL</div><h2 style="margin:6px 0">${esc(owned(match())?.name||'?')} – ${esc(opponent(match())?.name||'?')}</h2><span class="subtle" style="font-size:13px">${match().shots.length} Würfe erfasst · ${match().resin?'mit Harz':'ohne Harz'}</span></div><button class="btn primary" data-route="track">Spiel öffnen →</button></div></div>`:''}

    function teamsView(){return `${header('home')}<div class="title-row"><div><div class="eyebrow">MANNSCHAFTSDATENBANK</div><h1>Mannschaften</h1></div><button class="btn primary" data-new-team>＋ Neu</button></div>${db.teams.length?db.teams.map(t=>`<div class="panel"><div class="between" style="margin-bottom:13px"><div><div class="team-name">${esc(t.name)}</div><span class="note">${t.players.filter(p=>p.role==='goalkeeper').length} Torhüter · ${t.players.filter(p=>p.role!=='goalkeeper').length} Feldspieler</span></div><button class="btn sm" data-edit-team="${esc(t.id)}">Bearbeiten</button></div><div class="team-roster">${[...t.players].sort((a,b)=>(a.role==='goalkeeper'?-1:1)-(b.role==='goalkeeper'?-1:1)||a.number-b.number).map(p=>`<span class="mini-jersey" title="${esc(p.name||'')}">${p.role==='goalkeeper'?'🧤 ':''}${esc(p.number)}${p.name?' · '+esc(p.name):''}</span>`).join('')}</div><div style="margin-top:14px"><button class="btn sm warn ghost" data-remove-team="${esc(t.id)}">Mannschaft löschen</button></div></div>`).join(''):`<div class="blank">Noch keine Mannschaft gespeichert.<br>Erstelle deine erste Mannschaft mit Feldspielern und Torhütern.</div>`}${footer()}`}
    function startEditor(id=null,from='teams',slot=null){ui.editId=id;ui.editorReturn=from;ui.editorSlot=slot;ui.screen='editor';render()}

    function setup(){return `${header('home')}<div class="eyebrow">SCHRITT FÜR SCHRITT</div><h1>Neues Spiel</h1><p class="lead">Wähle zuerst die Mannschaften und danach, ob mit Harz gespielt wird.</p><div class="panel"><div class="setup-step"><span class="step-num">1</span><div style="flex:1"><h3>Eigene Mannschaft</h3><select class="select" aria-label="Eigene Mannschaft" data-setup="home">${teamOptions(ui.setup.homeId)}</select><div class="actions" style="margin-top:9px"><button class="btn sm ghost" data-team-for="home">＋ Neue Mannschaft erstellen</button></div></div></div><div class="setup-step"><span class="step-num">2</span><div style="flex:1"><h3>Gegnerische Mannschaft</h3><select class="select" aria-label="Gegnermannschaft" data-setup="away">${teamOptions(ui.setup.awayId)}</select><div class="actions" style="margin-top:9px"><button class="btn sm ghost" data-team-for="away">＋ Gegner erstellen</button></div></div></div><div class="setup-step"><span class="step-num">3</span><div style="flex:1"><h3>Wird mit Harz gespielt?</h3><div class="resin-choices"><button class="resin-btn ${ui.setup.resin===true?'chosen':''}" data-resin="true"><strong>Mit Harz</strong><span>Harz erlaubt</span></button><button class="resin-btn ${ui.setup.resin===false?'chosen':''}" data-resin="false"><strong>Ohne Harz</strong><span>Harzfrei</span></button></div></div></div><button class="btn primary wide" style="font-size:18px;margin-top:10px" data-start-game ${!ui.setup.homeId||!ui.setup.awayId||ui.setup.homeId===ui.setup.awayId||ui.setup.resin===null?'disabled':''}>Spiel starten →</button>${ui.setup.homeId===ui.setup.awayId&&ui.setup.homeId?'<p class="hint">Bitte zwei unterschiedliche Mannschaften wählen.</p>':''}</div>`}
    function clockBar(m){return `<div class="clock-bar"><div><div class="clock-heading">${m.clock.period}. Halbzeit</div><div class="clock-meta">${m.resin?'● Mit Harz':'○ Ohne Harz'}</div></div><button class="clock-button" data-toggle-clock aria-label="Spieluhr starten oder stoppen"><span class="clock-time" id="clock-time">${mmss(clockMs(m))}</span><span class="clock-hint" id="clock-hint">${m.clock.runningSince!==null?'■ Antippen zum Stoppen':'▶ Antippen zum Starten'}</span></button><div class="actions" style="justify-content:flex-end"><button class="btn sm ghost" data-clock-modal>Uhr ⚙</button></div></div>`}
    function jerseyPanel(m){const t=opponent(m);return `<div class="players-panel"><div class="players-head"><strong>Gegner: ${esc(t?.name||'?')}</strong><span>${t?.players.length||0} Spieler</span></div><div class="jersey-grid">${(t?.players||[]).slice().sort((a,b)=>a.number-b.number).map(p=>`<button title="${esc(p.name||'Nr. '+p.number)}" class="jersey ${ui.shooter===p.number?'selected':''}" data-shooter="${esc(p.number)}" ${ui.stage==='keeper'?'disabled':''}><span>${esc(p.number)}</span>${p.name?`<small>${esc(p.name)}</small>`:''}</button>`).join('')}</div></div>`}
    function track(){const m=match();if(!m){ui.screen='home';return home()}const t=opponent(m);const p=t?.players.find(p=>p.number===ui.shooter);const chosenKeeper=keeperChoices(m).find(p=>p.number===ui.keeper);return `${header('home',`<button class="btn sm" data-route="stats">◉ Wurfstatistik</button>`)}<div class="between" style="margin-bottom:12px"><div><div class="eyebrow">SPIELAUFZEICHNUNG</div><div style="font-size:17px;font-weight:850;margin-top:3px">${esc(owned(m)?.name||'?')} <span class="subtle">vs.</span> ${esc(t?.name||'?')}</div></div><span class="tag lime">${m.shots.length} Würfe</span></div>
    <div class="sticky-tracker">${clockBar(m)}${ui.stage!=='keeper'&&chosenKeeper?`<div class="between keeper-selected" style="margin-bottom:8px"><span>🧤 Dein Torwart: <strong>Nr. ${esc(chosenKeeper.number)}${chosenKeeper.name?' · '+esc(chosenKeeper.name):''}</strong></span><button class="btn sm ghost" data-change-keeper>Wechseln</button></div>`:''}${jerseyPanel(m)}</div>
    <div class="track-top"><div class="crumbs"><span class="crumb ${ui.stage==='keeper'?'current':''}">1 · Torwart</span><span>›</span><span class="crumb ${ui.stage==='shooter'?'current':''}">2 · Werfer</span><span>›</span><span class="crumb ${ui.stage==='position'?'current':''}">3 · Position</span><span>›</span><span class="crumb ${ui.stage==='target'?'current':''}">4 · Ziel + Ergebnis</span></div></div>
    ${ui.stage==='keeper'?`<div class="panel lime-border"><div class="stage-title">Welcher deiner Torhüter steht im Tor?</div><p class="stage-sub">Wähle deinen Torwart einmal aus. Er bleibt für alle folgenden Würfe aktiv, bis du auf „Wechseln“ tippst. Danach kannst du oben die gegnerische Wurfnummer antippen.</p>${keepers(m).length===0?`<p class="free-hint">Für diese Mannschaft ist noch kein Torwart markiert. Du kannst vorläufig einen Spieler auswählen oder deinen Kader jetzt bearbeiten.</p><button class="btn sm ghost" data-edit-own-team>🧤 Torhüter im Kader festlegen</button>`:''}<div class="keeper-list">${keeperChoices(m).map(g=>`<button class="keeper-option ${ui.keeper===g.number?'active':''}" data-keeper="${esc(g.number)}"><small>🧤 TORWART</small><strong>${esc(g.number)}</strong><small>${esc(g.name||'Nr. '+g.number)}</small>${ui.keeper===g.number?'<small>Aktiv</small>':''}</button>`).join('')}</div></div>`:''}
    ${ui.stage==='shooter'?`<div class="panel lime-border"><div class="stage-title">Wer hat geworfen?</div><p class="stage-sub">Torwart Nr. ${esc(ui.keeper)} bleibt ausgewählt, bis du ihn wechselst. Tippe oben auf die gegnerische Trikotnummer.</p><div class="between"><span class="note">${m.shots.length} Würfe dokumentiert</span><button class="btn sm ghost" data-change-keeper>← Torwart ändern</button></div></div>`:''}
    ${ui.stage==='position'?`<div class="panel"><div class="between"><div class="stage-title">Von wo kam der Wurf?</div><button class="btn sm ghost" data-route="stats">◉ Wurfstatistik</button></div><p class="stage-sub">Torwart Nr. ${esc(ui.keeper)} · Werfer Nr. <strong style="color:var(--lime)">${esc(ui.shooter)}</strong>${p?.name?' · '+esc(p.name):''} – tippe auf eine Position oder setze einen freien Punkt.</p>${courtDiagram('record')}<div class="actions" style="margin-top:12px"><button class="btn ${ui.freeMode?'active':'secondary'}" data-free-mode>${ui.freeMode?'◎ Freie Position aktiv – Spielfeld antippen':'⊕ Freie Position auswählen'}</button><button class="btn ghost" data-back-shooter>← Andere Nummer</button></div></div>`:''}
    ${ui.stage==='target'?`<div class="panel"><div class="between" style="margin-bottom:9px"><div class="stage-title">Wohin wurde geworfen?</div><button class="btn sm secondary" data-route="stats">📊 Statistik öffnen</button></div><p class="stage-sub">Torwart Nr. ${esc(ui.keeper)} · Werfer Nr. <strong style="color:var(--lime)">${esc(ui.shooter)}</strong> · ${esc(posName(ui.position))}. Tippe ins Tor oder auf die Fläche daneben bzw. darüber.</p>${goalDiagram([],ui.target,true)}${ui.target?`<div class="between" style="margin-top:18px;margin-bottom:12px"><div class="stage-title">Was ist passiert?</div><button class="btn sm secondary" data-route="stats">📊 Wurfstatistik</button></div>${(ui.target.x<0||ui.target.x>1||ui.target.y<0||ui.target.y>1)?'<p class="outside-hint">Der Zielpunkt liegt außerhalb des Tores. Für einen Fehlwurf wähle „Vorbei“.</p>':''}<div class="form-group"><label class="label" for="shot-comment">Kommentar zum Wurf (optional)</label><textarea id="shot-comment" class="field comment" maxlength="500" placeholder="z. B. Heber, Gegenstoß, überraschender Wurf …">${esc(ui.comment)}</textarea></div><div class="detail-grid"><button class="outcome tor" data-result="goal" ${(ui.target.x<0||ui.target.x>1||ui.target.y<0||ui.target.y>1)?'disabled':''}><strong>⚽ Tor</strong><small>Ball war drin</small></button><button class="outcome save" data-result="save"><strong>✋ Gehalten</strong><small>Torwart hat pariert</small></button><button class="outcome miss" data-result="miss"><strong>↗ Vorbei</strong><small>Wurf neben / über das Tor</small></button><button class="outcome post" data-result="post"><strong>▣ Pfosten</strong><small>Latte oder Pfosten</small></button></div>`:'<div class="free-hint">↑ Tippe ins Tor oder daneben / darüber, um den Zielpunkt festzulegen.</div>'}<div class="actions" style="margin-top:12px"><button class="btn ghost" data-back-position>← Position ändern</button><button class="btn ghost" data-back-shooter>Andere Nummer</button></div></div>`:''}
    ${m.shots.length?`<div class="panel soft"><div class="between"><div><h3>Zuletzt erfasst</h3><span class="note">${shotSummary(m.shots[m.shots.length-1])}</span>${m.shots[m.shots.length-1].comment?`<span class="shot-comment">💬 ${esc(m.shots[m.shots.length-1].comment)}</span>`:''}</div><button class="btn sm warn ghost" data-undo>↶ Letzten Wurf löschen</button></div></div>`:''}${footer()}`}
    function posName(p){return POSITIONS.find(x=>x.id===p)?.name||p||'–'}
    function statsKeeperShots(m){return ui.statsKeeper==='all'?m.shots:ui.statsKeeper==='legacy'?m.shots.filter(s=>s.keeperNumber===undefined):m.shots.filter(s=>String(s.keeperNumber)===ui.statsKeeper)}
    function playerThrowNumber(m,s){return m.shots.filter(t=>String(t.shooter)===String(s.shooter)).findIndex(t=>t.id===s.id)+1}
    function gameThrowNumber(m,s){return m.shots.findIndex(t=>t.id===s.id)+1}
    function courtDiagram(mode){
      const recording=mode==='record',stats=mode==='stats';
      const playerMode=stats&&ui.statsMode==='player';
      const selected=stats?ui.statsPosition:ui.position;
      const showFree=stats&&ui.statsMode==='position'&&selected==='FREE';
      const m=(showFree||playerMode)?match():null;
      const keeperFiltered=m?statsKeeperShots(m):[];
      const freeShots=showFree?keeperFiltered.filter(s=>s.position==='FREE'&&Number.isFinite(s.freeX)&&Number.isFinite(s.freeY)):[];
      const freeMarkers=freeShots.map(s=>{const active=String(s.id)===ui.statsFreeShot;const x=50+clamp(s.freeX,0,1)*700,y=65+clamp(s.freeY,0,1)*400;return `<g data-free-shot="${esc(s.id)}" class="free-shot-pin ${active?'active':''}" role="button" tabindex="0" aria-label="Freier Wurf von Nummer ${esc(s.shooter)} bei ${mmss(s.ms)} auswählen"><title>Nr. ${esc(s.shooter)} · ${s.period}. HZ, ${mmss(s.ms)}</title><circle cx="${x}" cy="${y}" r="25" fill="${active?'#b6f06a':'#65d7dc'}"/><text x="${x}" y="${y+1}">${esc(s.shooter)}</text></g>`}).join('');
      const playerShots=playerMode&&ui.statsPlayer!=='all'?keeperFiltered.filter(s=>String(s.shooter)===ui.statsPlayer):[];
      const positionMarkers=POSITIONS.filter(p=>p.x!==undefined).map(p=>`<g data-position="${p.id}" class="court-zone ${selected===p.id?'active':''}" role="button" tabindex="0" aria-label="${p.name}"><circle class="spot-circle" cx="${p.x}" cy="${p.y}" r="30"/><text class="spot-text" x="${p.x}" y="${p.y+5}">${p.short}</text><text class="spot-sub" x="${p.x}" y="${p.y+48}">${p.name}</text></g>`).join('');
      const positionCounts=new Map();
      const playerMarkers=playerShots.map(s=>{
        const preset=POSITIONS.find(p=>p.id===s.position);
        if(!preset)return '';
        const actualX=s.position==='FREE'&&Number.isFinite(s.freeX)?50+clamp(s.freeX,0,1)*700:preset.x;
        const actualY=s.position==='FREE'&&Number.isFinite(s.freeY)?65+clamp(s.freeY,0,1)*400:preset.y;
        if(!Number.isFinite(actualX)||!Number.isFinite(actualY))return '';
        const key=s.position==='FREE'?`${s.position}:${Math.round(actualX/28)}:${Math.round(actualY/28)}`:s.position;
        const n=positionCounts.get(key)||0;positionCounts.set(key,n+1);
        const angle=n*2.4,radius=n?25+Math.floor((n-1)/8)*21:0;
        const x=clamp(actualX+Math.cos(angle)*radius,73,726),y=clamp(actualY+Math.sin(angle)*radius,84,442);
        const number=playerThrowNumber(m,s),active=String(s.id)===ui.statsPlayerShot;
        return `<g data-player-shot="${esc(s.id)}" class="player-shot-pin ${active?'active':''}" role="button" tabindex="0" aria-label="Wurf ${number} von Nummer ${esc(s.shooter)}, ${esc(posName(s.position))}, ${mmss(s.ms)} auswählen"><title>Wurf ${number} · ${esc(posName(s.position))} · ${s.period}. HZ ${mmss(s.ms)} · ${esc(RESULTS[s.result]?.label||s.result)}</title>${n?`<path d="M${actualX} ${actualY}L${x} ${y}" stroke="#b6f06a" stroke-opacity=".46" stroke-width="2" stroke-dasharray="4 4"/>`:''}<circle cx="${x}" cy="${y}" r="24" fill="${active?'#b6f06a':'#65d7dc'}"/><text x="${x}" y="${y+1}">${number}</text></g>`;
      }).join('');
      const freePoint=recording&&ui.freeMode&&ui.freeCoord?`<circle cx="${ui.freeCoord.x*700+50}" cy="${ui.freeCoord.y*400+65}" r="10" fill="#b6f06a" stroke="white" stroke-width="3" pointer-events="none"/>`:'';
      return `<div class="diagram-wrap"><svg class="diagram court-svg" viewBox="0 0 800 510" role="group" aria-label="Schematische Draufsicht des Handball-Spielfeldes: Wurfposition auswählen"><defs><pattern id="courtgrain" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 32L32 0" stroke="#9fffff" stroke-opacity=".035"/></pattern></defs><rect width="800" height="510" rx="14" fill="#10414a"/><rect width="800" height="510" fill="url(#courtgrain)"/><rect x="49" y="45" width="702" height="430" rx="2" fill="none" stroke="#a5e4e6" stroke-width="3" opacity=".65"/><path d="M 220 46 C220 186 312 250 400 250 C488 250 580 186 580 46" stroke="#b5e6e4" stroke-width="4" fill="none"/><path d="M 130 46 C130 246 255 352 400 352 C545 352 670 246 670 46" stroke="#d7f2e5" stroke-width="3" stroke-dasharray="14 13" fill="none" opacity=".8"/><path d="M380 316H420" stroke="#f8eee2" stroke-width="6" stroke-linecap="round"/><rect x="338" y="30" width="124" height="18" fill="#f1f6e9"/><path d="M338 32h16v16h-16m32-16h16v16h-16m32-16h16v16h-16m32-16h12v16h-12" fill="#ef695b"/><text x="400" y="19" text-anchor="middle" fill="#d7f1ed" font-size="13" font-weight="800">TOR</text><rect data-free-court="true" x="50" y="58" width="700" height="420" fill="transparent" style="cursor:${recording&&ui.freeMode?'crosshair':'default'}"/>${playerMode?playerMarkers:showFree?freeMarkers:positionMarkers}${freePoint}<text x="67" y="493" font-size="11" fill="#bed8d9">${playerMode?'Nummern = Wurfnummer dieses Spielers · freie Positionen exakt':'Wurfpositionen – schematische Darstellung'}</text></svg></div>`
    }
    function goalDiagram(shots=[],target=null,interactive=false,numbering="match"){
      const gx=145,gy=122,gw=610,gh=350;
      const point=(s)=>({x:gx+s.goalX*gw,y:gy+s.goalY*gh});
      const m=match();
      const dots=shots.map(s=>{const {x,y}=point(s),c=RESULTS[s.result]?.color||'#fff';const n=m?(numbering==='player'?playerThrowNumber(m,s):gameThrowNumber(m,s)):0;const active=numbering==='player'&&String(ui.statsPlayerShot)===String(s.id);const clickable=numbering==='player'?'data-player-shot="'+esc(s.id)+'" role="button" tabindex="0"':'';return `<g ${clickable} class="goal-shot-pin ${active?'active':''}" aria-label="Wurf ${n} auswählen"><title>Wurf ${n} · Nr. ${esc(s.shooter)} · ${esc(posName(s.position))} · ${esc(RESULTS[s.result]?.label||s.result)}</title><circle cx="${x}" cy="${y}" r="${n>99?16:15}" fill="${active?'#b6f06a':c}" fill-opacity=".96" stroke="${active?'#fff':'#09252d'}" stroke-width="2.5"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="${n>99?11:13}" font-weight="900" fill="#082630" pointer-events="none">${n}</text></g>`}).join('');
      const mark=target?`<g pointer-events="none"><circle cx="${gx+target.x*gw}" cy="${gy+target.y*gh}" r="15" fill="#b6f06a" stroke="#0a2228" stroke-width="4"/><path d="M${gx+target.x*gw-21} ${gy+target.y*gh}h42 M${gx+target.x*gw} ${gy+target.y*gh-21}v42" stroke="#0a2228" stroke-width="2"/></g>`:'';
      return `<div class="diagram-wrap"><svg class="diagram goal-svg" viewBox="0 0 900 555" role="group" aria-label="Tor von vorne mit auswählbaren Flächen links, rechts und über dem Tor"><defs><pattern id="netPattern" width="38.125" height="35" patternUnits="userSpaceOnUse"><path d="M38.125 0H0V35" fill="none" stroke="#b0d4d6" stroke-width="1.2" opacity=".42"/></pattern><linearGradient id="netBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#224b53"/><stop offset="1" stop-color="#102b36"/></linearGradient></defs>
      <rect width="900" height="555" fill="#123944"/><rect x="8" y="8" width="884" height="105" rx="12" fill="#27464c" fill-opacity=".85"/><rect x="9" y="124" width="127" height="346" rx="10" fill="#27464c" fill-opacity=".85"/><rect x="764" y="124" width="127" height="346" rx="10" fill="#27464c" fill-opacity=".85"/><text x="450" y="67" text-anchor="middle" font-size="23" font-weight="850" fill="#d9e9e9">↑ ÜBER DAS TOR</text><text x="71" y="295" text-anchor="middle" font-size="17" fill="#c9dcdc">LINKS</text><text x="829" y="295" text-anchor="middle" font-size="17" fill="#c9dcdc">RECHTS</text>

    function shotSummary(s){return `Torwart ${s.keeperNumber===undefined?'nicht erfasst':'Nr. '+s.keeperNumber} · Werfer Nr. ${s.shooter} · ${posName(s.position)} · ${s.period}. HZ ${mmss(s.ms)} · ${RESULTS[s.result]?.label||s.result}`}
    function stats(){
      const m=match();if(!m)return home();

      const playerShots=ui.statsMode==='player'&&ui.statsPlayer!=='all'?byKeeper.filter(s=>String(s.shooter)===ui.statsPlayer):[];
      const selectedPlayerShot=ui.statsMode==='player'&&ui.statsPlayerShot?playerShots.find(s=>String(s.id)===ui.statsPlayerShot):null;
      const selectedFree=ui.statsMode==='position'&&ui.statsPosition==='FREE'&&ui.statsFreeShot?byKeeper.find(s=>s.position==='FREE'&&String(s.id)===ui.statsFreeShot):null;
      let filtered=ui.statsMode==='all'?byKeeper:ui.statsMode==='player'?playerShots:byKeeper.filter(s=>s.position===ui.statsPosition);
      if(selectedFree)filtered=[selectedFree];
      if(selectedPlayerShot)filtered=[selectedPlayerShot];
      const freeShots=byKeeper.filter(s=>s.position==='FREE');
      const goals=filtered.filter(s=>s.result==='goal').length,saves=filtered.filter(s=>s.result==='save').length,attacks=goals+saves,percentage=attacks?Math.round(saves/attacks*100):0;
      const positionCounts=POSITIONS.map(p=>({...p,n:all.filter(s=>s.position===p.id).length})).filter(p=>p.n).sort((a,b)=>b.n-a.n),max=Math.max(1,...positionCounts.map(p=>p.n));
      const mappedKeepers=[...new Map(m.shots.filter(s=>s.keeperNumber!==undefined).map(s=>[String(s.keeperNumber),s.keeperName?`Nr. ${s.keeperNumber} · ${s.keeperName}`:`Nr. ${s.keeperNumber}`])).entries()];
      const missing=m.shots.some(s=>s.keeperNumber===undefined);
      const shooters=new Map();
      (opponent(m)?.players||[]).forEach(p=>shooters.set(String(p.number),p.name||''));
      m.shots.forEach(s=>{if(!shooters.has(String(s.shooter)))shooters.set(String(s.shooter),s.shooterName||'')});
      const playerOptions=[...shooters.entries()].sort((a,b)=>Number(a[0])-Number(b[0]));
      const currentShooter=playerOptions.find(([no])=>no===ui.statsPlayer);
      const goalHeader=ui.statsMode==='all'?'Alle Wurfziele':ui.statsMode==='player'?`Wurfziele · ${currentShooter?'Nr. '+currentShooter[0]:'Spieler wählen'}`:`Wurfziele · ${posName(ui.statsPosition)}`;
      return `${header('track',`<button class="btn sm" data-route="track">＋ Wurf erfassen</button>`)}<div class="eyebrow">AUSWERTUNG</div><h1>Wurfstatistik</h1><p class="lead">${esc(owned(m)?.name||'?')} gegen ${esc(opponent(m)?.name||'?')} · ${dateFmt(m.createdAt)} · ${m.resin?'mit':'ohne'} Harz</p>
      <div class="panel"><div class="between" style="margin-bottom:13px"><h2>Was möchtest du sehen?</h2><button class="btn sm" data-export-csv>CSV exportieren ↓</button></div>
        <div class="stats-filter"><label for="stats-keeper" class="label" style="margin:0">Torwart:</label><select class="select" id="stats-keeper" data-stats-keeper><option value="all" ${ui.statsKeeper==='all'?'selected':''}>Alle Torhüter</option>${mappedKeepers.map(([no,n])=>`<option value="${esc(no)}" ${ui.statsKeeper===no?'selected':''}>${esc(n)}</option>`).join('')}${missing?`<option value="legacy" ${ui.statsKeeper==='legacy'?'selected':''}>Ältere Würfe ohne Zuordnung</option>`:''}</select></div>
        <div class="stats-mode"><button class="btn ${ui.statsMode==='all'?'active':'secondary'}" data-stats-mode="all">Alle Würfe</button><button class="btn ${ui.statsMode==='position'?'active':'secondary'}" data-stats-mode="position">Nach Wurfposition</button><button class="btn ${ui.statsMode==='player'?'active':'secondary'}" data-stats-mode="player">Nach Spieler</button></div>
        ${ui.statsMode==='position'?`<p class="hint">Wähle die Wurfposition auf dem Spielfeld oder über die Schaltflächen.</p>${courtDiagram('stats')}<div class="position-chips">${POSITIONS.map(p=>`<button class="btn sm ${ui.statsPosition===p.id?'active':''}" data-position-filter="${p.id}">${p.name}</button>`).join('')}</div>${ui.statsPosition==='FREE'?`<div class="free-positions"><div class="between"><h3>Freie Wurfpositionen (${freeShots.length})</h3>${selectedFree?`<button class="btn sm ghost" data-free-shot-all>Alle freien Würfe</button>`:''}</div><p class="hint">Die Kreise auf dem Spielfeld zeigen die genaue Wurfposition und die gegnerische Trikotnummer. Tippe auf eine Nummer oder wähle unten einen einzelnen Wurf aus.</p>${freeShots.length?`<div class="free-shot-options">${freeShots.slice().reverse().map(s=>`<button data-free-shot="${esc(s.id)}" class="free-shot-option ${selectedFree?.id===s.id?'active':''}"><span class="free-shot-number">${esc(s.shooter)}</span><span><strong>Nr. ${esc(s.shooter)}${s.shooterName?' · '+esc(s.shooterName):''}</strong><small>${s.period}. Halbzeit · ${mmss(s.ms)} · ${esc(RESULTS[s.result]?.label||s.result)}</small></span></button>`).join('')}</div>`:`<div class="blank">Noch keine freien Wurfpositionen erfasst.</div>`}${selectedFree?`<div class="free-shot-details"><strong>Ausgewählt: Nr. ${esc(selectedFree.shooter)} · ${selectedFree.period}. Halbzeit, ${mmss(selectedFree.ms)}</strong><p>Der grüne Kreis oben zeigt den genauen Abwurfort. Im Torbild unten siehst du, wohin der Ball geflogen ist (${esc(RESULTS[selectedFree.result]?.label||selectedFree.result)}).</p>${selectedFree.comment?`<p>💬 ${esc(selectedFree.comment)}</p>`:''}</div>`:''}</div>`:''}`:''}
        ${ui.statsMode==='player'?`<div class="player-stats"><h3>Gegnerischen Spieler auswählen</h3><p class="hint">Wähle eine Trikotnummer. Du siehst alle Abwurfstellen dieser Person und kannst einen einzelnen Wurf antippen.</p><div class="player-choice-grid">${playerOptions.map(([no,name])=>`<button class="player-choice ${ui.statsPlayer===no?'active':''}" data-stats-player="${esc(no)}"><strong>${esc(no)}</strong>${name?`<small>${esc(name)}</small>`:''}<span>${m.shots.filter(s=>String(s.shooter)===no).length} ${m.shots.filter(s=>String(s.shooter)===no).length===1?'Wurf':'Würfe'}</span></button>`).join('')}</div>${!playerOptions.length?`<div class="blank">Für die gegnerische Mannschaft gibt es noch keine Spieler.</div>`:''}${ui.statsPlayer!=='all'?`<div class="between" style="margin-top:16px"><h3>Abwurfstellen · Nr. ${esc(ui.statsPlayer)}</h3>${selectedPlayerShot?`<button class="btn sm ghost" data-player-shot-all>Alle Würfe der Nr. ${esc(ui.statsPlayer)}</button>`:''}</div><p class="hint">Die Zahlen auf dem Spielfeld sind die Wurfnummern dieses Spielers. Tippe auf eine Zahl, um die genaue Zielstelle unten im Tor zu sehen. Bei mehrfacher gleicher Position sind die Punkte leicht versetzt; freie Positionen entsprechen den eingetippten Stellen.</p>${courtDiagram('stats')}<div class="free-shot-options" style="max-height:340px">${playerShots.map(s=>{const n=playerThrowNumber(m,s);return `<button data-player-shot="${esc(s.id)}" class="free-shot-option ${selectedPlayerShot?.id===s.id?'active':''}"><span class="free-shot-number">${n}</span><span><strong>Wurf ${n} · ${esc(posName(s.position))}</strong><small>${s.period}. Halbzeit · ${mmss(s.ms)} · ${esc(RESULTS[s.result]?.label||s.result)}</small></span></button>`}).join('')}</div>${!playerShots.length?`<div class="blank" style="margin-top:12px">Für diese Auswahl wurden noch keine Würfe dokumentiert.</div>`:''}${selectedPlayerShot?`<div class="free-shot-details"><strong>Wurf ${playerThrowNumber(m,selectedPlayerShot)} · Nr. ${esc(selectedPlayerShot.shooter)} · ${esc(posName(selectedPlayerShot.position))}</strong><p>${selectedPlayerShot.period}. Halbzeit, ${mmss(selectedPlayerShot.ms)} · ${esc(RESULTS[selectedPlayerShot.result]?.label||selectedPlayerShot.result)}. Der markierte Punkt im Tor zeigt das Wurfziel.</p>${selectedPlayerShot.comment?`<p>💬 ${esc(selectedPlayerShot.comment)}</p>`:''}</div>`:''}`:'<div class="blank" style="margin-top:12px">Bitte zuerst eine Trikotnummer auswählen.</div>'}</div>`:''}
      </div>
      <div class="panel"><div class="panel-head"><h2>${esc(goalHeader)}</h2><span class="tag lime">${filtered.length} ${filtered.length===1?'Wurf':'Würfe'}</span></div>${goalDiagram(filtered,null,false,ui.statsMode==='player'?'player':'match')}<p class="numbering-hint">${ui.statsMode==='player'?'Zahlen im Tor = wievielter Wurf dieses Spielers im gesamten Spiel.':'Zahlen im Tor = laufende Wurfnummer des gesamten Spiels.'} ${ui.statsMode==='player'?'Tippe auf eine Zahl im Tor oder auf dem Spielfeld, um den Wurf auszuwählen.':''}</p><div class="goal-legend"><span><i class="dot" style="background:${RESULTS.goal.color}"></i>Tor</span><span><i class="dot" style="background:${RESULTS.save.color}"></i>Gehalten</span><span><i class="dot" style="background:${RESULTS.miss.color}"></i>Vorbei</span><span><i class="dot" style="background:${RESULTS.post.color}"></i>Pfosten</span></div><p class="note">Würfe über und neben dem Tor werden außerhalb des Torrahmens gezeigt. Bei gleichen Zielstellen können die Punkte übereinanderliegen.</p></div>
      <div class="stat-grid" style="margin-bottom:17px"><div class="stat-tile"><span class="stat-value">${goals}</span><span class="stat-label">Gegentore</span></div><div class="stat-tile"><span class="stat-value">${saves}</span><span class="stat-label">Gehalten</span></div><div class="stat-tile"><span class="stat-value" style="color:var(--lime)">${attacks?percentage+' %':'–'}</span><span class="stat-label">Haltequote*</span></div></div><p class="note" style="margin:-8px 0 18px">* Gehalten ÷ (Tore + gehaltene Würfe). Vorbei und Pfosten zählen nicht in die Haltequote.</p>
      ${ui.statsMode==='all'&&positionCounts.length?`<div class="panel"><h2 style="margin-bottom:16px">Woher kommen die Würfe?</h2>${positionCounts.map(p=>`<div class="bar-row"><span>${p.name}</span><div class="bar-track"><div class="bar-fill" style="width:${p.n/max*100}%"></div></div><strong style="text-align:right">${p.n}</strong></div>`).join('')}</div>`:''}
      <div class="panel"><div class="panel-head"><h2>Einzelne Würfe</h2><span class="tag">${filtered.length}</span></div>${filtered.length?`<div class="throw-list">${filtered.slice().reverse().map(s=>`<div class="throw-row"><span class="throw-number">${ui.statsMode==='player'?playerThrowNumber(m,s):gameThrowNumber(m,s)}</span><div><strong>Nr. ${esc(s.shooter)}${s.shooterName?' · '+esc(s.shooterName):''} · ${esc(posName(s.position))}</strong><small>🧤 ${s.keeperNumber===undefined?'ohne Torwartzuordnung':`Torwart ${esc(s.keeperNumber)}${s.keeperName?' · '+esc(s.keeperName):''}`} · ${s.period}. Halbzeit · ${mmss(s.ms)}</small>${s.comment?`<span class="shot-comment">💬 ${esc(s.comment)}</span>`:''}</div><span class="result-chip ${RESULTS[s.result]?.cls||''}">${RESULTS[s.result]?.label||esc(s.result)}</span></div>`).join('')}</div>`:`<div class="blank">Hier sind noch keine Würfe für diese Auswahl erfasst.</div>`}</div>${footer()}`
    }
    function footer(){return `<div class="footer-note">KeeperBoard · Daten bleiben lokal auf diesem Gerät gespeichert.<br>Erstelle gelegentlich eine Datensicherung.</div>`}
    function modal(){if(!ui.modal)return '';if(ui.modal.type==='clock'){const m=match();return `<div class="modal-backdrop" data-overlay><div class="modal"><div class="between" style="margin-bottom:15px"><h3>Spieluhr einstellen</h3><button class="btn sm ghost" data-close-modal>✕</button></div><p class="hint">Die Uhr zählt ab dem eingegebenen Wert hoch. Bei Halbzeitwechsel beginnt die 2. Halbzeit bei 00:00.</p><form id="clock-form"><label class="label">Minuten</label><input class="field" name="minutes" type="number" min="0" max="180" value="${Math.floor(clockMs(m)/60000)}" required><label class="label" style="margin-top:12px">Sekunden</label><input class="field" name="seconds" type="number" min="0" max="59" value="${Math.floor(clockMs(m)/1000)%60}" required><div class="actions" style="margin-top:16px"><button class="btn primary" type="submit">Uhr übernehmen</button><button class="btn secondary" type="button" data-set-half="${m.clock.period===1?2:1}">${m.clock.period===1?'2. Halbzeit starten':'Zur 1. Halbzeit'}</button></div></form></div></div>`}if(ui.modal.type==='confirm'){return `<div class="modal-backdrop" data-overlay><div class="modal"><h3>${esc(ui.modal.title)}</h3><p class="lead" style="margin:12px 0 20px">${esc(ui.modal.body)}</p><div class="actions"><button class="btn warn" data-confirm>${esc(ui.modal.confirmLabel||'Ja, löschen')}</button><button class="btn primary" data-close-modal>Abbrechen</button></div></div></div>`}return ''}
    function render(){app.innerHTML=`<main class="shell">${ui.screen==='home'?home():ui.screen==='teams'?teamsView():ui.screen==='editor'?editor():ui.screen==='setup'?setup():ui.screen==='track'?track():ui.screen==='stats'?stats():home()}</main>${modal()}`;tick()}
    function tick(){const el=document.getElementById('clock-time');if(el&&match()){el.textContent=mmss(clockMs(match()));const hint=document.getElementById('clock-hint');if(hint)hint.textContent=match().clock.runningSince!==null?'■ Antippen zum Stoppen':'▶ Antippen zum Starten'}}
    function promptDelete(title,body,fn,confirmLabel='Ja, löschen'){ui.modal={type:'confirm',title,body,action:fn,confirmLabel};render()}
    function currentPoint(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const ctm=svg.getScreenCTM();return ctm?pt.matrixTransform(ctm.inverse()):{x:0,y:0}}
    function registerShot(result){const m=match();if(!m||ui.keeper===null||ui.shooter===null||!ui.position||!ui.target)return;const p=opponent(m)?.players.find(p=>p.number===ui.shooter),g=keeperChoices(m).find(p=>p.number===ui.keeper);const comment=(document.getElementById('shot-comment')?.value??ui.comment).trim().slice(0,500);m.activeKeeper=ui.keeper;m.shots.push({id:uid(),keeperNumber:ui.keeper,keeperName:g?.name||'',shooter:ui.shooter,shooterName:p?.name||'',position:ui.position,freeX:ui.freeCoord?.x??null,freeY:ui.freeCoord?.y??null,goalX:ui.target.x,goalY:ui.target.y,result,comment,period:m.clock.period,ms:Math.round(clockMs(m)/1000)*1000,createdAt:Date.now()});save();resetDraft();render();toast(`${RESULTS[result].label} gespeichert · Wurf ${m.shots.length}`)}
    function startGame(){const a=ui.setup.homeId,b=ui.setup.awayId;if(!a||!b||a===b||!team(a)||!team(b)||ui.setup.resin===null){toast('Bitte beide Mannschaften und Harz auswählen.');return}if(!team(b).players.length){toast('Die gegnerische Mannschaft benötigt Trikotnummern.');return}const m={id:uid(),homeId:a,awayId:b,resin:ui.setup.resin,createdAt:Date.now(),clock:{period:1,elapsedMs:0,runningSince:null},shots:[]};db.matches.push(m);db.activeMatchId=m.id;save();go('track')}
    function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
    function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
    function exportCsv(){const m=match();if(!m)return;const titles=['Spiel','Datum','Eigenes Team','Gegner','Harz','Halbzeit','Spielzeit','Torwart Nummer','Torwart Name','Werfer Nummer','Werfer Name','Position','Freie Position X %','Freie Position Y %','Tor X % (außerhalb: <0 oder >100)','Tor Y % (außerhalb: <0 oder >100)','Ergebnis','Kommentar','Zeitstempel'];const data=m.shots.map(s=>[m.id,dateFmt(m.createdAt),owned(m)?.name||'',opponent(m)?.name||'',m.resin?'Ja':'Nein',s.period,mmss(s.ms),s.keeperNumber??'',s.keeperName||'',s.shooter,s.shooterName,posName(s.position),s.freeX===null?'':Math.round(s.freeX*100)/100,s.freeY===null?'':Math.round(s.freeY*100)/100,Math.round(s.goalX*100),Math.round(s.goalY*100),RESULTS[s.result]?.label||s.result,s.comment||'',new Date(s.createdAt).toISOString()]);download('handball-wuerfe-'+new Date(m.createdAt).toISOString().slice(0,10)+'.csv','\uFEFF'+[titles,...data].map(row=>row.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
    function handleClick(e){const btn=e.target.closest('button,[data-goal-area],[data-free-court],[data-position],[data-free-shot],[data-player-shot]');if(!btn)return;
      if(btn.hasAttribute('data-route')){go(btn.dataset.route);return}
      if(btn.hasAttribute('data-new-team')){startEditor();return}
      if(btn.hasAttribute('data-edit-team')){startEditor(btn.dataset.editTeam);return}
      if(btn.hasAttribute('data-team-for')){startEditor(null,'setup',btn.dataset.teamFor);return}
      if(btn.hasAttribute('data-add-row')){const area=document.getElementById('roster-rows');area.insertAdjacentHTML('beforeend',rosterRow(area.children.length));return}
      if(btn.hasAttribute('data-remove-row')){btn.closest('.roster-row')?.remove();return}
      if(btn.hasAttribute('data-resin')){ui.setup.resin=btn.dataset.resin==='true';render();return}
      if(btn.hasAttribute('data-start-game')){startGame();return}
      if(btn.hasAttribute('data-open-match')){db.activeMatchId=btn.dataset.openMatch;save();go('track');return}
      if(btn.hasAttribute('data-remove-match')){const id=btn.dataset.removeMatch;promptDelete('Spiel löschen?','Alle Würfe und Zeitdaten dieses Spiels werden unwiderruflich gelöscht.',()=>{db.matches=db.matches.filter(m=>m.id!==id);if(db.activeMatchId===id)db.activeMatchId=null;save();ui.screen='home'});return}
      if(btn.hasAttribute('data-remove-team')){const id=btn.dataset.removeTeam;if(db.matches.some(m=>m.homeId===id||m.awayId===id)){toast('Mannschaft wird in einem Spiel verwendet und kann nicht gelöscht werden.');return}promptDelete('Mannschaft löschen?','Die Mannschaft und ihre Spielerliste werden unwiderruflich gelöscht.',()=>{db.teams=db.teams.filter(t=>t.id!==id);save()});return}
      if(btn.hasAttribute('data-toggle-clock')){toggleClock();return}
      if(btn.hasAttribute('data-clock-modal')){ui.modal={type:'clock'};render();return}
      if(btn.hasAttribute('data-close-modal')){ui.modal=null;render();return}
      if(btn.hasAttribute('data-confirm')){const fn=ui.modal?.action;ui.modal=null;if(typeof fn==='function')fn();render();return}
      if(btn.hasAttribute('data-set-half')){const m=match();const half=Number(btn.dataset.setHalf);if(!m)return;pauseClock(m);m.clock.period=half;m.clock.elapsedMs=0;save();ui.modal=null;render();toast(`${half}. Halbzeit eingestellt – Uhr steht auf 00:00`);return}
      if(btn.hasAttribute('data-keeper')){const m=match();ui.keeper=Number(btn.dataset.keeper);if(m){m.activeKeeper=ui.keeper;save()}ui.shooter=null;ui.position=null;ui.target=null;ui.comment='';ui.stage='shooter';render();return}
      if(btn.hasAttribute('data-edit-own-team')){startEditor(match()?.homeId,'track');return}
      if(btn.hasAttribute('data-change-keeper')){ui.stage='keeper';ui.shooter=null;ui.position=null;ui.target=null;ui.comment='';render();return}
      if(btn.hasAttribute('data-shooter')){if(ui.keeper===null){toast('Bitte zuerst deinen Torwart auswählen.');return}ui.shooter=Number(btn.dataset.shooter);ui.stage='position';ui.position=null;ui.freeMode=false;ui.freeCoord=null;ui.target=null;render();return}
      if(btn.hasAttribute('data-free-mode')){ui.freeMode=!ui.freeMode;render();return}
      if(btn.hasAttribute('data-back-shooter')){ui.stage='shooter';ui.shooter=null;ui.position=null;ui.target=null;render();return}
      if(btn.hasAttribute('data-back-position')){ui.stage='position';ui.target=null;render();return}
      if(btn.hasAttribute('data-position')){const pos=btn.dataset.position;if(ui.screen==='stats'){ui.statsMode='position';ui.statsPosition=pos;ui.statsFreeShot=null;render()}else if(ui.screen==='track'&&ui.stage==='position'){ui.position=pos;ui.freeCoord=null;ui.freeMode=false;ui.stage='target';render()}return}
      if(btn.hasAttribute('data-free-court')){if(ui.screen==='track'&&ui.stage==='position'&&ui.freeMode){const svg=btn.closest('svg'),p=currentPoint(svg,e);ui.position='FREE';ui.freeCoord={x:clamp((p.x-50)/700,0,1),y:clamp((p.y-65)/400,0,1)};ui.stage='target';ui.freeMode=false;render()}return}
      if(btn.hasAttribute('data-goal-area')){if(ui.screen==='track'&&ui.stage==='target'){const svg=btn.closest('svg'),p=currentPoint(svg,e);ui.target={x:clamp((p.x-145)/610,-0.235,1.235),y:clamp((p.y-122)/350,-0.345,1.237)};render()}return}
      if(btn.hasAttribute('data-result')){registerShot(btn.dataset.result);return}
      if(btn.hasAttribute('data-undo')){const m=match();if(m&&m.shots.length)promptDelete('Letzten Wurf löschen?','Der zuletzt gespeicherte Wurf wird entfernt.',()=>{m.shots.pop();save()});return}
      if(btn.hasAttribute('data-stats-mode')){ui.statsMode=btn.dataset.statsMode;ui.statsFreeShot=null;ui.statsPlayerShot=null;if(ui.statsMode==='player'&&ui.statsPlayer==='all'){ui.statsPlayer=String(match()?.shots[0]?.shooter??'all')}render();return}
      if(btn.hasAttribute('data-stats-player')){ui.statsMode='player';ui.statsPlayer=btn.dataset.statsPlayer;ui.statsPlayerShot=null;render();return}
      if(btn.hasAttribute('data-player-shot')){if(ui.screen==='stats'&&ui.statsMode==='player'){ui.statsPlayerShot=ui.statsPlayerShot===btn.dataset.playerShot?null:btn.dataset.playerShot;render()}return}
      if(btn.hasAttribute('data-player-shot-all')){ui.statsPlayerShot=null;render();return}
      if(btn.hasAttribute('data-free-shot')){if(ui.screen==='stats'){ui.statsMode='position';ui.statsPosition='FREE';ui.statsFreeShot=btn.dataset.freeShot;render()}return}
      if(btn.hasAttribute('data-free-shot-all')){ui.statsFreeShot=null;render();return}
      if(btn.hasAttribute('data-position-filter')){ui.statsMode='position';ui.statsPosition=btn.dataset.positionFilter;ui.statsFreeShot=null;render();return}
      if(btn.hasAttribute('data-export-csv')){exportCsv();return}
      if(btn.hasAttribute('data-export-backup')){download('keeperboard-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('Datensicherung heruntergeladen');return}
      if(btn.hasAttribute('data-import-backup')){const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';picker.onchange=()=>{const file=picker.files?.[0];if(!file)return;file.text().then(txt=>{try{const obj=JSON.parse(txt);if(!Array.isArray(obj.teams)||!Array.isArray(obj.matches))throw Error('Ungültiges Format');promptDelete('Datensicherung importieren?','Achtung: Deine aktuellen Mannschaften und Spiele werden durch die Daten aus dieser Datei ersetzt.',()=>{db={teams:obj.teams,matches:obj.matches,activeMatchId:null};save();ui.screen='home'},'Ja, importieren')}catch(_){toast('Diese Datei ist keine gültige KeeperBoard-Sicherung.')}})};picker.click();return}
    }
    function handleChange(e){if(e.target.hasAttribute('data-setup')){ui.setup[e.target.dataset.setup==='home'?'homeId':'awayId']=e.target.value;render()}if(e.target.hasAttribute('data-stats-keeper')){ui.statsKeeper=e.target.value;ui.statsFreeShot=null;ui.statsPlayerShot=null;render()}}
    function handleSubmit(e){if(e.target.id==='team-form'){e.preventDefault();const name=e.target.elements.teamName.value.trim();const rows=[...e.target.querySelectorAll('.roster-row')];let players=[];for(const row of rows){const nr=row.querySelector('[data-field="number"]').value.trim(),person=row.querySelector('[data-field="name"]').value.trim();if(!nr&&!person)continue;if(!/^(0|[1-9]\d{0,2})$/.test(nr)){toast('Bitte gültige Trikotnummern von 0 bis 999 eintragen.');return}players.push({number:Number(nr),name:person,role:row.querySelector('[data-field="role"]').value==='goalkeeper'?'goalkeeper':'field'})}if(!name){toast('Bitte Mannschaftsnamen eingeben.');return}if(!players.length){toast('Bitte mindestens einen Spieler mit Nummer eingeben.');return}if(new Set(players.map(p=>p.number)).size!==players.length){toast('Jede Trikotnummer darf nur einmal vorkommen.');return}let item=team(ui.editId);if(item){item.name=name;item.players=players}else{item={id:uid(),name,players};db.teams.push(item)}if(ui.editorSlot)ui.setup[ui.editorSlot==='home'?'homeId':'awayId']=item.id;save();const ret=ui.editorReturn;ui.editId=null;ui.editorSlot=null;go(ret);toast('Mannschaft gespeichert');return}
      if(e.target.id==='clock-form'){e.preventDefault();const m=match();if(!m)return;const f=new FormData(e.target),minutes=Number(f.get('minutes')),seconds=Number(f.get('seconds'));if(!Number.isInteger(minutes)||minutes<0||minutes>180||!Number.isInteger(seconds)||seconds<0||seconds>59){toast('Bitte gültige Zeit eingeben.');return}const wasRunning=m.clock.runningSince!==null;m.clock.elapsedMs=(minutes*60+seconds)*1000;m.clock.runningSince=wasRunning?Date.now():null;ui.modal=null;save();render();toast('Spieluhr aktualisiert')}
    }
    app.addEventListener('click',handleClick);
    app.addEventListener('change',handleChange);
    app.addEventListener('input',e=>{if(e.target.id==='shot-comment')ui.comment=e.target.value});
    app.addEventListener('submit',handleSubmit);
    app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-position],[data-free-shot],[data-player-shot]')){e.preventDefault();e.target.click()}});
    setInterval(tick,300);
    resetDraft();
    render();
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  })();
  </script>
</body>
</html>
